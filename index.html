<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Procedural 3D Tool</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #111416;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
      color: #e8e0d8;
    }

    :root {
      --panel-w: 320px;
    }

    /* Preview fills the viewport; when the Fractal Explorer panel is open it
       gives up the panel's width on the right. */
    #app {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      right: 0;
    }

    body.panel-open #app {
      right: var(--panel-w);
    }

    canvas {
      display: block;
    }

    .lil-gui {
      --width: var(--panel-w);
    }

    /* Pin the Fractal Explorer flush to the right edge. */
    .lil-gui.root {
      top: 0;
      right: 0;
    }
  </style>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
